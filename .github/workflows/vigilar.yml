name: Vigilar vacantes VT6

# Cada 20 minutos, de 5:00 a 22:00 hora de Costa Rica.
#
# Por qué cada 20 minutos: el MEP deja cada vacante publicada 24 horas hábiles.
# Un aviso diario se perdería la mitad.
#
# Por qué no de madrugada: las vacantes las publican en horario de oficina, así
# que revisar a las 3 AM solo golpea un sitio del gobierno sin ganar nada. Los
# cron van en UTC y Costa Rica es UTC-6 todo el año (no hay horario de verano),
# así que 11:00 UTC = 5:00 AM en CR.
on:
  schedule:
    - cron: '*/20 11-23 * * *'   # 05:00 - 17:59 CR
    - cron: '*/20 0-3 * * *'     # 18:00 - 21:59 CR
  workflow_dispatch:
    inputs:
      modo:
        description: 'prueba = solo mira y guarda, no manda WhatsApp'
        type: choice
        options: [prueba, real]
        default: prueba
      simular_fallo:
        description: 'Romper la corrida a propósito, para comprobar que la alarma avisa'
        type: boolean
        default: false

permissions:
  contents: write

# Dos corridas a la vez se pisarían al hacer commit del estado.
concurrency:
  group: vigilar
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Sin caché, cada corrida baja las dependencias y los ~130 MB de Chromium.
      # A 51 corridas por día eso es puro tiempo tirado (y ancho de banda ajeno).
      - name: Caché de dependencias y navegador
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: deps-${{ runner.os }}-${{ hashFiles('package.json') }}

      - run: npm install

      # `--with-deps` corre por dentro un `apt-get update`, y eso consulta TODAS
      # las fuentes del runner, incluida la de Google Chrome, que este vigilante
      # no usa para nada: Playwright se trae su propio Chromium. El 09/09/2026
      # esa fuente ajena devolvió un índice corrupto ("Hash Sum mismatch"), apt
      # se rindió con código 100 y la corrida murió sin llegar a mirar el MEP.
      # Borrarla no cuesta nada: el runner se destruye al terminar.
      - name: Quitar las fuentes de apt que no usamos
        run: sudo rm -f /etc/apt/sources.list.d/*google*

      # Aun sin Google, cualquier espejo de Ubuntu puede fallar un rato. Antes
      # un tropiezo así mandaba el WhatsApp de "se rompió" por algo que se
      # arregla solo, así que ahora se reintenta. Entre intentos hay que borrar
      # el índice ya bajado: si quedó a medias, repetir sin limpiarlo vuelve a
      # leer el mismo archivo malo y falla igual.
      #
      # Si el navegador ya vino de la caché, esto no descarga nada: solo verifica.
      - name: Instalar Chromium
        run: |
          for intento in 1 2 3; do
            if npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Intento $intento sin exito; limpiando el indice de apt y reintentando..."
            sudo rm -rf /var/lib/apt/lists/*
            sleep 15
          done
          echo "::error::No se pudo instalar Chromium despues de 3 intentos."
          exit 1

      - name: Revisar las vacantes
        env:
          # En las corridas por horario no hay inputs, y ahi el modo debe ser real.
          MODO: ${{ inputs.modo || 'real' }}
          SIMULAR_FALLO: ${{ inputs.simular_fallo && '1' || '0' }}
          WAHA_URL: ${{ secrets.WAHA_URL }}
          WAHA_API_KEY: ${{ secrets.WAHA_API_KEY }}
          WAHA_CHAT_ID: ${{ secrets.WAHA_CHAT_ID }}
        run: node revisar.mjs

      # Un vigilante caido se ve igual que uno que no encontro nada: silencio.
      # Por eso el fallo se avisa por WhatsApp, con freno de 3 horas para no
      # mandar 50 mensajes si el MEP se cae un fin de semana.
      - name: Avisar si se rompió
        if: failure()
        env:
          WAHA_URL: ${{ secrets.WAHA_URL }}
          WAHA_API_KEY: ${{ secrets.WAHA_API_KEY }}
          WAHA_CHAT_ID: ${{ secrets.WAHA_CHAT_ID }}
          ENLACE_CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node avisar-fallo.mjs fallo "la corrida de GitHub Actions falló"

      # Y avisar cuando vuelve, para no quedarse con la duda de si sigue caído.
      - name: Avisar que se recuperó
        if: success()
        env:
          WAHA_URL: ${{ secrets.WAHA_URL }}
          WAHA_API_KEY: ${{ secrets.WAHA_API_KEY }}
          WAHA_CHAT_ID: ${{ secrets.WAHA_CHAT_ID }}
        run: node avisar-fallo.mjs ok

      # El estado de lo ya avisado vive en el repo: es lo que evita que la misma
      # vacante se avise cada 20 minutos durante su ventana de 24 horas.
      - name: Guardar estado y salida
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A salida estado
          git commit -m "Vacantes revisadas ($(date -u '+%Y-%m-%d %H:%M UTC'))" || echo "Sin cambios."

          # Otra corrida pudo haber commiteado mientras esta trabajaba, y los dos
          # escriben los mismos archivos de estado. Antes esto era un
          # `git pull --rebase || true` que ante un conflicto dejaba el repo a
          # medias y se comía el error: el estado no se guardaba y NADIE se
          # enteraba. Asi se perdio el catalogo de especialidades el 03/09/2026.
          #
          # -X theirs, dentro de un rebase, quiere decir "quedate con lo que
          # estoy reaplicando", o sea con lo de ESTA corrida, que es la que tiene
          # la foto mas reciente.
          guardado=no
          for intento in 1 2 3; do
            git fetch origin main
            if git rebase -X theirs origin/main; then
              if git push; then guardado=si; break; fi
            else
              git rebase --abort || true
            fi
            echo "Intento $intento sin exito; reintentando..."
            sleep 5
          done

          if [ "$guardado" != "si" ]; then
            echo "::error::No se pudo guardar el estado despues de 3 intentos."
            echo "Sin estado guardado se repiten avisos ya mandados, asi que esto"
            echo "tiene que verse en rojo y no pasar callado."
            exit 1
          fi
