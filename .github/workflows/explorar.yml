name: Explorar la app del MEP

# Se corre A MANO desde la pestaña Actions (o con `gh workflow run explorar.yml`).
# No tiene horario: es una herramienta de diagnóstico, no el vigilante.
#
# Qué hace: abre https://apps.mep.go.cr/formulario con Chromium de verdad, guarda
# lo que ve en salida/ y hace commit de esos archivos al repo, para poder mirarlos
# sin descargar nada a mano.
on:
  workflow_dispatch:

# Necesario para que el job pueda hacer push de los resultados.
permissions:
  contents: write

jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install

      # --with-deps instala también las librerías de sistema que Chromium
      # necesita en Ubuntu. Sin eso el navegador no arranca en el runner.
      #
      # Ese paso corre un `apt-get update`, que consulta todas las fuentes del
      # runner incluida la de Google Chrome, que no usamos (Playwright trae su
      # propio Chromium) y que ya tumbó una corrida del vigilante por devolver
      # un índice corrupto. Mismo blindaje que en vigilar.yml.
      - name: Quitar las fuentes de apt que no usamos
        run: sudo rm -f /etc/apt/sources.list.d/*google*

      - name: Instalar Chromium
        run: |
          for intento in 1 2 3; do
            if npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Intento $intento sin exito; limpiando el indice de apt y reintentando..."
            sudo rm -rf /var/lib/apt/lists/*
            sleep 15
          done
          echo "::error::No se pudo instalar Chromium despues de 3 intentos."
          exit 1

      - name: Explorar
        run: node explorar.mjs

      # Los resultados quedan en el repo para poder leerlos con `git pull`.
      - name: Guardar los resultados en el repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A salida
          git commit -m "Resultado de la exploración del MEP ($(date -u '+%Y-%m-%d %H:%M UTC'))" || echo "No hubo cambios que guardar."
          git push

      # Copia de respaldo descargable, por si el push falla.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: salida
          path: salida/
          # .gitkeep es un archivo oculto y upload-artifact los ignora por
          # defecto: sin esto, una corrida que no llegue a escribir nada avisa
          # "no files found" y no queda ni rastro de que se intentó.
          include-hidden-files: true
          if-no-files-found: warn
